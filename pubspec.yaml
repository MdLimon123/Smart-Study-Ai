name: flutter_extension
description: "Flutter extension"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons:
  get:
  shared_preferences:
  flutter_screenutil:
  flutter_svg:
  flutter_spinkit:
  cached_network_image:
  flutter_cache_manager: ^3.4.1
  shimmer: 
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  camera: ^0.11.0+2
  # Camera2 implementation — avoids CameraX re-init / surface bugs when leaving & returning to scan.
  camera_android: ^0.10.10+16
  permission_handler: ^11.3.0
  flutter_markdown: ^0.7.4
  flutter_markdown_latex: ^0.3.4
  markdown: ^7.3.0
  flutter_math_fork: ^0.7.4
  path_provider: ^2.1.5
  file_saver: ^0.3.1
  open_file: ^3.5.11
  pdf: ^3.12.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/language/
    - assets/images/
    - assets/icon/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
